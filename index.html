    function getPlatformMeta(platformId = '', url = '') {
      const pid = (platformId || '').toLowerCase();
      if (pid && pid !== 'auto') {
        const match = SOCIAL_PLATFORMS.find(p => p.id === pid);
        if (match) return match;
      }
      const u = (url || '').toLowerCase();
      if (u.includes('facebook.com') || u.includes('fb.com')) return SOCIAL_PLATFORMS.find(p => p.id === 'facebook');
      if (u.includes('youtube.com') || u.includes('youtu.be')) return SOCIAL_PLATFORMS.find(p => p.id === 'youtube');
      if (u.includes('instagram.com')) return SOCIAL_PLATFORMS.find(p => p.id === 'instagram');
      if (u.includes('tiktok.com')) return SOCIAL_PLATFORMS.find(p => p.id === 'tiktok');
      if (u.includes('whatsapp.com') || u.includes('wa.me')) return SOCIAL_PLATFORMS.find(p => p.id === 'whatsapp');
      if (u.includes('t.me') || u.includes('telegram.')) return SOCIAL_PLATFORMS.find(p => p.id === 'telegram');
      if (u.includes('m.me') || u.includes('messenger.com')) return SOCIAL_PLATFORMS.find(p => p.id === 'messenger');
      if (u.includes('linkedin.com')) return SOCIAL_PLATFORMS.find(p => p.id === 'linkedin');
      if (u.includes('github.com')) return SOCIAL_PLATFORMS.find(p => p.id === 'github');
      if (u.includes('x.com') || u.includes('twitter.com')) return SOCIAL_PLATFORMS.find(p => p.id === 'x');
      return SOCIAL_PLATFORMS.find(p => p.id === 'website');
    }

          if (parsed && parsed.portfolio && Array.isArray(parsed.bioPages)) {

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = message;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      lucide.createIcons();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 2800);
    }

    function openConfirm(text, onYes) {
      document.getElementById('confirm-text').textContent = text;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeConfirm(confirmed) {
      const modal = document.getElementById('confirm-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');

    // Hash route synchronization (#/, #/admin, #/ovi, #/katherponno)
    function parseHashRoute() {
      const hash = window.location.hash || '#/';
      const clean = hash.replace(/^#\/?/, '').trim();
      if (!clean || clean === 'portfolio') {
        currentView = 'portfolio';
      } else if (clean === 'admin') {
        currentView = 'admin';
      } else {
        currentView = 'bio';
        currentBioUsername = clean;
      }
      const bioLabel = document.getElementById('nav-bio-label');
      if (bioLabel) bioLabel.textContent = currentBioUsername;
      updateNavButtons();
    }

    function navigate(view, username = null) {
      currentView = view;
      if (username) {
        currentBioUsername = username;
      }
      if (view === 'portfolio') {
        window.location.hash = '#/';
      } else if (view === 'admin') {
        window.location.hash = '#/admin';
      } else {
        window.location.hash = `#/${currentBioUsername}`;
      }
      const bioLabel = document.getElementById('nav-bio-label');
      if (bioLabel) bioLabel.textContent = currentBioUsername;
      updateNavButtons();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateNavButtons() {
      const views = ['portfolio', 'bio', 'admin'];
      views.forEach(v => {

        if (!btn) return;
        if (v === currentView) {
          btn.className = 'px-3 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5 bg-emerald-600 text-white shadow';
        } else {
          btn.className = 'px-3 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5 hover:bg-white/10 text-slate-200';
        }
      });
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderMediaElement(url, altText, className, isVideoControls = false) {
      const fallbackAvatar = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(altText || 'Ovi') + '&size=256&background=10b981&color=fff';
      if (isVideoSource(url)) {
        return `<video src="${escapeHtml(url)}" ${isVideoControls ? 'controls playsInline' : 'autoplay loop muted playsInline'} class="${className}"></video>`;
      }
      return `<img src="${escapeHtml(url || fallbackAvatar)}" onerror="this.src='${fallbackAvatar}'" alt="${escapeHtml(altText || '')}" class="${className}" />`;
    }

                                <div class="flex items-center gap-2">
                                  <p class="font-semibold text-sm text-slate-900 truncate">${escapeHtml(link.title)}</p>
                                  <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium shrink-0">${meta.name}</span>
                                </div>
                                <p class="text-xs text-slate-500 truncate">${escapeHtml(link.url)}</p>
                              </div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                              ${idx > 0 ? `<button type="button" onclick="moveSocialLink('${currentBio.id}', ${idx}, -1)" class="p-1.5 text-slate-500 hover:bg-slate-200 rounded-lg" title="উপরে নিন"><i data-lucide="arrow-up" class="w-3.5 h-3.5"></i></button>` : ''}
                              ${idx < currentBio.links.length - 1 ? `<button type="button" onclick="moveSocialLink('${currentBio.id}', ${idx}, 1)" class="p-1.5 text-slate-500 hover:bg-slate-200 rounded-lg" title="নিচে নিন"><i data-lucide="arrow-down" class="w-3.5 h-3.5"></i></button>` : ''}
                              <button type="button" onclick="startEditSocialLink('${currentBio.id}', '${link.id}')" class="px-2.5 py-1 text-xs font-medium text-blue-600 hover:bg-blue-50 rounded-lg">এডিট</button>
                              <button type="button" onclick="deleteSocialLink('${currentBio.id}', '${link.id}')" class="text-red-500 p-1.5 hover:bg-red-50 rounded-lg" title="ডিলিট"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  ` : ''}
                </div>
              </div>
            `}
          </div>
        </div>
      `;
    }

    // ==================== ADMIN INTERACTION FUNCTIONS ====================
    function syncPortfolioInputs() {
      const nameEl = document.getElementById('p-name');
      if (!nameEl) return;
      state.portfolio.full_name = nameEl.value.trim();
      state.portfolio.tagline = document.getElementById('p-tagline')?.value.trim() || '';
      state.portfolio.bio = document.getElementById('p-bio')?.value.trim() || '';
      state.portfolio.avatar_url = document.getElementById('p-avatar')?.value.trim() || '';
      state.portfolio.present_address = document.getElementById('p-present')?.value.trim() || '';
      state.portfolio.permanent_address = document.getElementById('p-permanent')?.value.trim() || '';
      state.portfolio.email = document.getElementById('p-email')?.value.trim() || '';
      state.portfolio.phone = document.getElementById('p-phone')?.value.trim() || '';
      state.portfolio.skills = (document.getElementById('p-skills')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
    }

    function handleFileSelect(event, target, index = null) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const resultUrl = e.target.result;
        if (target === 'portfolio') {
          state.portfolio.avatar_url = resultUrl;
          const inputEl = document.getElementById('p-avatar');
          if (inputEl) inputEl.value = resultUrl;
          saveState();
          showToast('নতুন মিডিয়া ফাইল যুক্ত হয়েছে!');
          render();
        } else if (target === 'newbio') {
          const bioInput = document.getElementById('new-bio-avatar');
          if (bioInput) bioInput.value = resultUrl;
          showToast('বায়ো পেজের মিডিয়া সিলেক্ট হয়েছে!');
        } else if (target === 'project' && index !== null) {
          syncPortfolioInputs();
          state.portfolio.projects[index].media_url = resultUrl;
          saveState();
          showToast('প্রজেক্ট মিডিয়া যুক্ত হয়েছে!');
          render();
        }
      };
      reader.readAsDataURL(file);
    }

    function handleSavePortfolio(e) {
      e.preventDefault();
      syncPortfolioInputs();
      saveState();
      showToast('পোর্টফোলিওর সব তথ্য সফলভাবে সেভ হয়েছে!');
      render();
    }

    function handleCreateBioPage(e) {
      e.preventDefault();
      const rawUsername = document.getElementById('new-bio-username').value;
      const cleanUsername = rawUsername.toLowerCase().replace(/[^a-z0-9_-]/g, '');
      if (!cleanUsername) {
        showToast('সঠিক ইংরেজি ইউজারনেম দিন!');
        return;
      }
      if (state.bioPages.some(b => b.username === cleanUsername)) {
        showToast('এই ইউজারনেমটি ইতিমধ্যে ব্যবহৃত হয়েছে!');
        return;
      }

      const created = {
        id: 'bio-' + Date.now(),
        username: cleanUsername,
        display_name: document.getElementById('new-bio-name').value.trim(),
        avatar_url: document.getElementById('new-bio-avatar').value.trim(),
        bio_text: document.getElementById('new-bio-text').value.trim(),
        theme_color: document.getElementById('new-bio-color').value,
        links: []
      };

      state.bioPages.push(created);
      selectedAdminBioId = created.id;
      currentBioUsername = cleanUsername;
      editingLinkId = null;
      document.getElementById('nav-bio-label').textContent = cleanUsername;
      saveState();
      showToast(`নতুন লিংক /${cleanUsername} তৈরি হয়েছে!`);
      render();
    }

    function confirmDeleteBioPage(pageId) {
      openConfirm('আপনি কি নিশ্চিতভাবে এই ইউজারনেম পেজটি ডিলিট করতে চান?', () => {
        state.bioPages = state.bioPages.filter(b => b.id !== pageId);
        selectedAdminBioId = state.bioPages[0]?.id || '';
        currentBioUsername = state.bioPages[0]?.username || 'ovi';
        editingLinkId = null;
        document.getElementById('nav-bio-label').textContent = currentBioUsername;
        saveState();
        showToast('ইউজারনেম পেজ ডিলিট করা হয়েছে।');
        render();
      });
    }

    function updateBioMeta(pageId, field, value) {
      const page = state.bioPages.find(b => b.id === pageId);
      if (page) {
        page[field] = value;
        saveState();
        showToast('পরিবর্তন সেভ হয়েছে!');
      }
    }

    function startEditSocialLink(pageId, linkId) {
      const page = state.bioPages.find(b => b.id === pageId);
      const link = page?.links.find(l => l.id === linkId);
      if (!link) return;
      editingLinkId = linkId;
      render();
      setTimeout(() => {
        const platEl = document.getElementById('link-platform');
        const titleEl = document.getElementById('new-link-title');
        const urlEl = document.getElementById('new-link-url');
        if (platEl) platEl.value = link.platform || 'auto';
        if (titleEl) titleEl.value = link.title || '';
        if (urlEl) urlEl.value = link.url || '';
      }, 10);
    }

    function handleSaveSocialLink(e, pageId) {
      e.preventDefault();
      const page = state.bioPages.find(b => b.id === pageId);
      if (!page) return;
      const platform = document.getElementById('link-platform').value;
      const title = document.getElementById('new-link-title').value.trim();
      let url = document.getElementById('new-link-url').value.trim();
      if (!url.startsWith('http') && !url.startsWith('tel:') && !url.startsWith('mailto:') && url !== '#portfolio') {
        url = 'https://' + url;
      }

      if (editingLinkId) {
        const targetLink = page.links.find(l => l.id === editingLinkId);
        if (targetLink) {
          targetLink.platform = platform;
          targetLink.title = title;
          targetLink.url = url;
        }
        editingLinkId = null;
        showToast('লিংক আপডেট হয়েছে!');
      } else {
        page.links.push({
          id: 'link-' + Date.now(),
          platform,
          title,
          url
        });
        showToast('নতুন সোশ্যাল লিংক যোগ হয়েছে!');
      }

      saveState();
      render();
    }

    function deleteSocialLink(pageId, linkId) {
      const page = state.bioPages.find(b => b.id === pageId);
      if (!page) return;
      page.links = page.links.filter(l => l.id !== linkId);
      if (editingLinkId === linkId) editingLinkId = null;
      saveState();
      showToast('লিংক মুছে ফেলা হয়েছে।');
      render();
    }

    function moveSocialLink(pageId, idx, delta) {
      const page = state.bioPages.find(b => b.id === pageId);
      if (!page) return;
      const targetIdx = idx + delta;
      if (targetIdx < 0 || targetIdx >= page.links.length) return;
      const temp = page.links[idx];
      page.links[idx] = page.links[targetIdx];
      page.links[targetIdx] = temp;
      saveState();
      render();
    }

    function copyBioShareLink(username) {
      const shareUrl = `${window.location.origin}${window.location.pathname}#/${username}`;
      const tempInput = document.createElement('input');
      tempInput.value = shareUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      showToast(`কপি হয়েছে: /${username}`);
    }

    function resetDemoData() {
      openConfirm('সব কাস্টম পরিবর্তন মুছে ডিফল্ট ডাটায় ফিরে যেতে চান?', () => {
        localStorage.removeItem('ovi_portfolio_live_preview_v2');
        state = JSON.parse(JSON.stringify(DEFAULT_DATA));
        selectedAdminBioId = state.bioPages[0].id;
        currentBioUsername = state.bioPages[0].username;
        editingLinkId = null;
        document.getElementById('nav-bio-label').textContent = currentBioUsername;
        showToast('ডিফল্ট ডাটা রিসেট হয়েছে!');
        render();
      });
    }

    function render() {
      const app = document.getElementById('app');
      if (currentView === 'portfolio') {
        app.innerHTML = renderPortfolio();
      } else if (currentView === 'bio') {
        app.innerHTML = renderBioPage();
      } else {
        app.innerHTML = renderAdmin();
      }
      lucide.createIcons();
    }

    window.addEventListener('hashchange', () => {
      parseHashRoute();
      render();
    });

    window.onload = function() {
      parseHashRoute();
      render();
    };
  </script>
</body>
</html>
